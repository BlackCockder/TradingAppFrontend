<section id="dashboard-core" class="flex items-stretch">
  <div id="dashboard-sidebar-filler" class="h-screen hidden md:w-40 md:flex flex-col bg-gray-med"></div>
  <section id="dashboard-sidebar" class="h-screen hidden md:w-40 md:flex md:fixed md:top-0 md:left-0 flex-col bg-gray-med">
    <div class="w-full h-dashboard-sidebar-logo flex justify-center items-center">
      <img
        src="https://scontent-waw2-2.xx.fbcdn.net/v/t39.30808-6/316421925_1438259539997448_8125312075424248893_n.jpg?_nc_cat=106&ccb=1-7&_nc_sid=a5f93a&_nc_ohc=jLqALCuCOJgQ7kNvgEtX1SY&_nc_ht=scontent-waw2-2.xx&_nc_gid=AyHMy7iE62Rp4QFTe3Vu4YR&oh=00_AYDuXoPZ3Qx0U9sa0wS1Qt4GNPM2roqAMlLk8PF6UBfMKA&oe=670F1F1B"
        class="w-10 h-10 sidebar-img-round hover:cursor-pointer" alt="TradingApp Logo"
        routerLink="/dashboard">
      <p class="font-semibold text-base text-white op-text-base pl-2 hover:cursor-pointer" routerLink="/dashboard">Dashboard</p>

    </div>
    <div class="overflow-auto sidebar-button-wrapper flex-1">
      <div class="w-full h-20 flex items-center justify-center cursor-pointer relative btn-background-slide needs-force-update"
           [ngClass]="{'bg-gray-light': button.highlighted,}" [routerLink]="button.redirectsTo.replace('/', '')"
           (click)="buttonClicked(i)"
           *ngFor="let button of sidebarButtons; let i = index">
        <div *ngIf="button.highlighted" class="absolute top-0 left-0 h-full w-1 sidebar-button-highlighter">

        </div>
        <div>
          <div class="w-full h-6 text-white op-text-darker"
               [ngClass]="{'op-text-base': button.highlighted, 'op-text-darker': !button.highlighted,}"
               [innerHTML]="button.svg">

          </div>
          <p class="text-white text-base"
             [ngClass]="{'op-text-base': button.highlighted, 'op-text-darker': !button.highlighted,}">{{ button.buttonName }}</p>
        </div>

      </div>
    </div>
    <div class="absolute w-full h-20 bottom-0 left-0">

    </div>
  </section>
  <section class="flex flex-col flex-1">
    <section id="dashboard-header"
             class="w-full h-dashboard-header">
      <app-dashboard-header></app-dashboard-header>
    </section>
    <section class="w-full h-dashboard-content flex-1">
      <div id="dashboard-core-wrapper" class="p-6 dashboard-core-wrapper-main">
        <router-outlet>
          <ng-content></ng-content>
        </router-outlet>
      </div>
    </section>
  </section>

</section>
