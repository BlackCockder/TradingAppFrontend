<app-dashboard-window-template id="Creator-DashboardWindowTemplate-1" [inputTitle]="'Creator'">
  <form id="Creator-Form-1-1" (ngSubmit)="submitCreation()">
    <input id="Creator-Input-1-1-1" type="file" (change)="onFileSelected($event)" />
    <button id="Creator-Button-1-1-2" type="submit" class="w-24 h-8 bg-amber-700">Submit now</button>
  </form>
  <div id="Creator-Div-1-2" class="flex w-full h-96">
    <quill-editor id="Creator-QuillEditor-1-2-1"
      [(ngModel)]="offerDescription">
    </quill-editor>
  </div>

</app-dashboard-window-template>
