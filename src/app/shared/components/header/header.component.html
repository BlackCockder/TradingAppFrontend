<section id="header-content" class="w-full h-full flex items-center">
  <section id="header-logo-title" class="ml-4 header-logo-title-responsive flex items-center justify-center">
    <a href="" class="w-full h-full flex items-center justify-center">
      <img ngSrc="https://image.similarpng.com/file/similarpng/very-thumbnail/2021/07/Gaming-logo-template-on-transparent-background-PNG.png" alt="Logo" width="48" height="48" class="rounded-2xl">
      <h1 class="ml-4">
        TradingApp
      </h1>
    </a>
  </section>
  <section id="header-search-bar" class="h-full flex items-center justify-center header-search-bar-responsive">
    <p-iconfield>
      <p-inputicon styleClass="pi pi-search" />
      <input type="text" pInputText placeholder="Search" />
    </p-iconfield>
  </section>
  <section id="header-filler" class="flex-grow">

  </section>
  <section id="header-navigation" class="h-full flex items-center justify-evenly header-navigation-responsive">

    <a pButton pRipple severity="contrast" outlined routerLink="/marketplace">
      <i pButtonIcon class="pi pi-shopping-cart"></i>
      <span pButtonLabel>Marketplace</span>
    </a>

    <a pButton pRipple severity="contrast" outlined routerLink="/guide" >
      <i pButtonIcon class="pi pi-book"></i>
      <span pButtonLabel>Guide</span>
    </a>

    <p-button (click)="social.toggle($event)" severity="contrast" variant="outlined">
      <ng-template pTemplate="default">
        Social <i class="pi pi-chevron-down ml-2"></i>
      </ng-template>
    </p-button>
    <p-menu #social [popup]="true" [model]="items"></p-menu>

  </section>
  <div class="h-2/3">
    <p-divider layout="vertical" />
  </div>
  <section id="header-user-panel" class="flex items-center justify-evenly w">
    <p-button label="Login" severity="contrast" variant="text" (onClick)="closeDialog()">
    </p-button>
    <p-dialog maskStyleClass="backdrop-blur-sm" [(visible)]="visible" styleClass="!border-0 !bg-transparent">
      <ng-template #headless>
        <div
          class="flex flex-col px-8 py-8 gap-6 rounded-2xl"
          style="border-radius: 12px; background-image: radial-gradient(circle at left top, #3B3E41, #1E2124)"
        >
          <svg
            width="31"
            height="33"
            viewBox="0 0 31 33"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="block mx-auto"
          >
            <path
              d="..."
              fill="var(--p-primary-color)"
            />
          </svg>
          <div class="inline-flex flex-col gap-2">
            <label for="username" class="text-primary-50 font-semibold">Username</label>
            <input pInputText id="username" class="!bg-white/20 !border-0 !p-4 !text-primary-50 w-80" />
          </div>
          <div class="inline-flex flex-col gap-2">
            <label for="password" class="text-primary-50 font-semibold">Password</label>
            <input
              pInputText
              id="password"
              class="!bg-white/20 !border-0 !p-4 !text-primary-50 w-80"
              type="password"
            />
          </div>
          <div class="flex items-center gap-4">
            <p-button
              label="Cancel"
              (click)="closeDialog()"
              [text]="true"
              styleClass="!p-4 w-full !text-primary-50 !border !border-white/30 hover:!bg-white/10"
              class="w-full"
            />
            <p-button
              label="Sign-In"
              (click)="closeDialog()"
              [text]="true"
              styleClass="!p-4 w-full !text-primary-50 !border !border-white/30 hover:!bg-white/10"
              class="w-full"
            />
          </div>
        </div>
      </ng-template>
    </p-dialog>
    <p-button label="Sign up" severity="warn">
    </p-button>
  </section>
</section>
<hr>
