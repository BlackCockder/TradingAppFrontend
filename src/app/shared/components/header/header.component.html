<section id="header-content" class="w-full h-full flex items-center">
  <section id="header-logo-title" class="ml-4 header-logo-title-responsive flex items-center justify-center">
    <a href="" class="w-full h-full flex items-center justify-center">
      <img ngSrc="https://image.similarpng.com/file/similarpng/very-thumbnail/2021/07/Gaming-logo-template-on-transparent-background-PNG.png" alt="Logo" width="48" height="48" class="rounded-2xl">
      <h1 class="ml-4">
        TradingApp
      </h1>
    </a>
  </section>
  <section id="header-search-bar" class="h-full flex items-center justify-center header-search-bar-responsive">
    <p-iconfield styleClass="w-3/4">
      <p-inputicon styleClass="pi pi-search" />
      <input type="text" pInputText fluid placeholder="Search" />
    </p-iconfield>
  </section>
  <section id="header-filler" class="flex-grow">

  </section>
  <section id="header-navigation" class="h-full flex items-center justify-evenly header-navigation-responsive">

    <a pButton pRipple severity="contrast" outlined routerLink="/marketplace">
      <i pButtonIcon class="pi pi-shopping-cart"></i>
      <span pButtonLabel>Marketplace</span>
    </a>

    <a pButton pRipple severity="contrast" outlined routerLink="/guide" >
      <i pButtonIcon class="pi pi-book"></i>
      <span pButtonLabel>Guide</span>
    </a>

    <p-button (click)="social.toggle($event)" severity="contrast" variant="outlined">
      <ng-template pTemplate="default">
        Social <i class="pi pi-chevron-down ml-2"></i>
      </ng-template>
    </p-button>

  </section>
  <p-menu #social [popup]="true" [model]="items"></p-menu>
  <div class="h-2/3">
    <p-divider layout="vertical" />
  </div>
  <section id="header-user-panel" class="flex items-center justify-evenly header-user-panel-responsive">
    <p-button label="Login" severity="contrast" variant="text" (onClick)="triggerLogin()" icon="pi pi-arrow-circle-right" iconPos="right">
    </p-button>
    <p-button styleClass="w-28" label="Sign up" severity="warn">
    </p-button>
  </section>
</section>
<hr />
